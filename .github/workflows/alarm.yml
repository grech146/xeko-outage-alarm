name: questionnaire outage alarm

# Checks every 5 minutes, off the hour (GitHub's busiest moment), that the n8n account answers and the
# questionnaire is switched on. Logic and rules: check.py. A run that cannot send its buzz fails, and
# GitHub emails the owner on a failed scheduled run.

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: outage-alarm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_check.py
      - run: python3 check.py
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_KEY: ${{ secrets.N8N_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
